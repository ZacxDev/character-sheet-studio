name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # PROBE ONLY (throwaway branch, never merged): run the two new test files
      # against the PRE-CHANGE app first, so the red is the tests', not tsc's.
      - run: npx vitest run src/sdk-features.test.tsx src/share-link.test.tsx
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
