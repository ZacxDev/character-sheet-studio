# Civitai App Block — nginx config baked into every per-app pod image.
# The starter Dockerfile copies this to /etc/nginx/nginx.conf; downstream
# apps shouldn't need to change it. CSP frame-ancestors locks the iframe
# to civitai-controlled origins so a malicious block cannot be embedded
# on third-party sites.

worker_processes auto;
error_log /tmp/error.log warn;
pid /tmp/nginx.pid;
events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 1m;

  # All writes that nginx-as-non-root needs go to writable mounts (see
  # the template deployment — /tmp + /var/cache/nginx + /var/run are
  # emptyDirs). Override the defaults so they point inside those.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /tmp/access.log main;

  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # CSP: only civitai-controlled origins may embed the iframe.
    # If a new origin needs access (e.g. a new dev preview surface),
    # add it here and rebuild.
    add_header Content-Security-Policy
      "frame-ancestors 'self' https://civitai.com https://*.civitai.com https://civitaic.com https://*.civitaic.com"
      always;

    # Long-lived caching for hashed assets; no caching for index.html.
    location /assets/ {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable" always;
    }

    location /healthz {
      access_log off;
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    location / {
      try_files $uri /index.html;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
  }
}
